version: '3.8'

services:
  # 1. Database (PostgreSQL) -> Data Warehouse
  db:
    image: postgres:15
    container_name: pm25_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: air_quality_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Object Storage (MinIO) -> Data Lake
  minio:
    image: minio/minio
    container_name: pm25_minio
    ports:
      - "9000:9000"  # API Port (สำหรับ Python)
      - "9001:9001"  # Console Port (สำหรับเปิดดูผ่านเว็บ)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: